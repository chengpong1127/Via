volumes:
  valhalla-data:

services:

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      valhalla:
        condition: service_healthy
    command: sleep infinity

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/asia/taiwan-latest.osm.pbf}
    volumes:
      - valhalla-data:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/status >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 180s
