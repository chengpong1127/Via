name: deploy-checks
on:
  pull_request:
    paths: ["server/deploy/**", "infra/aws/**"]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash && sudo mv kustomize /usr/local/bin/
      - run: server/deploy/k8s/overlays/aws-mvp/check.sh
      - run: server/deploy/aws/bootstrap/test-profile.sh
