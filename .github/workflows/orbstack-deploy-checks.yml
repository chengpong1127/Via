name: OrbStack deploy checks

on:
  push:
    branches: [main]
    paths:
      - "server/deploy/orbstack*.sh"
      - "server/deploy/tests/**"
      - ".github/workflows/deploy-orbstack.yml"
      - ".github/workflows/server.yml"
      - ".github/workflows/orbstack-deploy-checks.yml"
  pull_request:
    paths:
      - "server/deploy/orbstack*.sh"
      - "server/deploy/tests/**"
      - ".github/workflows/deploy-orbstack.yml"
      - ".github/workflows/server.yml"
      - ".github/workflows/orbstack-deploy-checks.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Shellcheck
        run: shellcheck server/deploy/orbstack*.sh server/deploy/tests/*.sh
      - name: Deploy script tests
        run: server/deploy/tests/orbstack-deploy-test.sh
      - name: Deploy workflow lint
        run: server/deploy/tests/deploy-workflow-test.sh
