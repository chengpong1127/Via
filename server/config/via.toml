# Nonsecret defaults. Restart processes after edits; preprocessing changes require via-data build.
[server]
port = 3000
request_timeout_ms = 5000
http_timeout_ms = 10000
max_concurrent_requests = 32
max_body_bytes = 65536

[routing]
max_transfers = 4
max_static_corridors = 24
max_concurrent_phase2_states = 4
max_concurrent_phase2_corridors = 8
max_concurrent_reconstruction_candidates = 4
max_candidates = 16
max_departures_per_query = 3
max_journey_duration_seconds = 14400

[routing.access]
max_transit_access_stops = 24
max_transit_egress_stops = 24
max_walking_radius_metres = 2000
max_walking_seconds = 1800

[routing.ranking]
metro_transfer_buffer_seconds = 180
bus_transfer_buffer_seconds = 300
near_duplicate_arrival_seconds = 300
material_walking_difference_seconds = 300
max_sequence_only_option_delay_seconds = 900
reliability_preference_window_seconds = 300
result_limit = 3

[bikeshare]
max_pickup_stations_per_anchor = 3
max_dropoff_stations_per_anchor = 3
max_stations_per_endpoint = 3
endpoint_radius_metres = 1500
max_endpoint_walk_seconds = 900
max_bike_duration_seconds = 3600
max_bike_distance_metres = 20000
optimistic_walk_speed_metres_per_second = 2.0

[bikeshare.preprocessing]
max_geometric_radius_metres = 300
max_walking_duration_seconds = 480
max_walking_distance_metres = 800
max_geometric_candidates_per_boarding_point = 16
max_access_stations_per_boarding_point = 8
max_matrix_concurrency = 4

[preprocessing]
same_stop_transfer_seconds = 120

[preprocessing.transfers]
radius_metres = 500
max_duration_seconds = 480
max_distance_metres = 800
max_outgoing = 12
max_concurrency = 8
source_group_size = 128

[tdx]
api_base_url = "https://tdx.transportdata.tw/api/basic/"
token_url = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token"
connect_timeout_ms = 3000
request_timeout_ms = 20000
download_timeout_seconds = 1800
max_response_bytes = 33554432
max_rate_limit_retries = 2
minimum_token_lifetime_seconds = 60
token_refresh_margin_seconds = 30
bike_catalog_page_size = 1000

[tdx.batch]
bike_stations = 400
bus_stops = 200
metro_pairs = 200
metro_response_limit = 1000

[tdx.realtime]
fresh_seconds = 120
degraded_seconds = 180
max_clock_skew_seconds = 300

[tdx.bikeshare]
cache_ttl_seconds = 45
cache_capacity = 50000
max_concurrent_cities = 4
max_age_seconds = 120
max_clock_skew_seconds = 300

[valhalla]
base_url = "http://127.0.0.1:8002/"
request_timeout_ms = 1200
build_request_timeout_ms = 15000
max_concurrency = 8
max_sources = 32
max_targets = 32
max_response_bytes = 2097152
