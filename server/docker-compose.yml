services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VIA_ENV: ${VIA_ENV:-development}
      VIA_VALHALLA_URL: ${VIA_VALHALLA_URL:-http://valhalla:8002/}
      VIA_STATIC: ${VIA_STATIC:?Set VIA_STATIC to the .via-static.json path before starting Compose}
    volumes:
      - ./data:/app/server/data:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      valhalla:
        condition: service_healthy

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/asia/taiwan-latest.osm.pbf}
    volumes:
      - ./var/valhalla:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/status >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 180s
