services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      VIA_VALHALLA_URL: http://valhalla:8002/
      VIA_TRANSIT_NETWORK: /app/server/data/dev/taipei/transit-network.json
      VIA_BIKESHARE_NETWORK: /app/server/data/dev/taipei/bikeshare-network.json
    volumes:
      - ./data:/app/server/data:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      valhalla:
        condition: service_healthy

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/asia/taiwan-latest.osm.pbf}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./var/valhalla:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8002/status | jq --exit-status '(.available_actions // []) | (index(\"route\") != null and index(\"sources_to_targets\") != null)' >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 180s
