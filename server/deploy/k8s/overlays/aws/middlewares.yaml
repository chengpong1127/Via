apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plan-rate-limit
  namespace: via
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 10
    sourceCriterion:
      ipStrategy:
        depth: 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: in-flight-limit
  namespace: via
spec:
  inFlightReq:
    amount: 10
    sourceCriterion:
      ipStrategy:
        depth: 0
