apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: server
          env:
            - name: VIA_STATIC
              value: /data/static/current/.via-static.json
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
      volumes:
        - name: static
          emptyDir: null
          hostPath:
            path: /var/lib/via/static
            type: Directory
