apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: via
resources:
  - ../../base
  - refresh.yaml
configMapGenerator:
  - name: refresh-scripts
    files:
      - refresh-static.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: via-server
    newName: via-server
    newTag: dev
  - name: via-refresh
    newName: via-refresh
    newTag: dev
replicas:
  - name: server
    count: 1
  - name: valhalla
    count: 1
patches:
  - path: local-image.yaml
  - path: volumes.yaml
  - target:
      kind: Service
      name: server
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 3000
