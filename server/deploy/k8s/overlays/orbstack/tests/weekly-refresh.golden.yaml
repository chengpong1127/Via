apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-refresh
  namespace: via
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: weekly-refresh
        spec:
          containers:
          - command:
            - /bin/bash
            - /scripts/refresh-static.sh
            env:
            - name: HOST_DATA_DIR
              value: /absolute/path/to/Via/server/data
            - name: VIA_ENV
              value: production
            - name: VIA_VALHALLA_URL
              value: http://valhalla:8002/
            - name: VIA_FETCH_REQUESTS_PER_MINUTE
              value: "60"
            - name: ROLLOUT_TIMEOUT
              value: 600s
            - name: TDX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: TDX_CLIENT_ID
                  name: tdx-credentials
            - name: TDX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: TDX_CLIENT_SECRET
                  name: tdx-credentials
            image: via-refresh:dev
            imagePullPolicy: Never
            name: refresh
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - mountPath: /scripts
              name: scripts
              readOnly: true
            - mountPath: /build/server/data
              name: data
          restartPolicy: Never
          securityContext:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          serviceAccountName: weekly-refresh
          volumes:
          - hostPath:
              path: /absolute/path/to/Via/server/data
              type: Directory
            name: data
          - configMap:
              defaultMode: 365
              name: refresh-scripts
            name: scripts
  schedule: 0 23 * * 0
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  timeZone: Asia/Taipei

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weekly-refresh
  namespace: via

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weekly-refresh
  namespace: via
rules:
- apiGroups:
  - apps
  resourceNames:
  - server
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weekly-refresh
  namespace: via
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weekly-refresh
subjects:
- kind: ServiceAccount
  name: weekly-refresh
  namespace: via

