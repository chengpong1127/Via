apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
spec:
  template:
    spec:
      volumes:
        - name: tiles
          emptyDir: null
          hostPath:
            path: /absolute/path/to/Via/server/var/valhalla
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  template:
    spec:
      volumes:
        - name: static
          emptyDir: null
          hostPath:
            path: /absolute/path/to/Via/server/data/build/<build-id>
            type: Directory
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-refresh
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: refresh
              env:
                - name: HOST_DATA_DIR
                  value: /absolute/path/to/Via/server/data
          volumes:
            - name: data
              emptyDir: null
              hostPath:
                path: /absolute/path/to/Via/server/data
                type: Directory
